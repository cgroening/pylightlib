[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pylightlib"
version = "0.2.0"
description = "A modular Python library for GUI development, storage, and debugging utilities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["gui", "tkinter", "pyqt", "textual", "utilities", "debugging", "storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["N802", "N803", "N813", "N815", "N816", "N999"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["annotation-unchecked"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
qt = ["PyQt5"]
textual = ["textual>=0.41.0"]
